name: Lab testing on push

on:
  push:
  workflow_dispatch:
    inputs:
      run-optional-cg:
        type: choice
        options:
          - skip
          - free
          - affect
        default: 'free'
        description: 'Skip optional cg check, run and not affect the result, run and affect the result'

jobs:
  branch:
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v3
      - name: Branch
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-branch.sh
        shell: bash
  content:
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v3
      - name: Content
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-files.sh
        shell: bash
  author:
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v3
      - name: Author
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-student.sh
        shell: bash
  build:
    needs: [content, author, branch]
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v3
      - name: Build
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/build.sh
        shell: bash
      - name: Build results
        uses: actions/upload-artifact@v4
        with:
          name: labs
          path: ${{ github.workspace }}/out
          overwrite: true
  acceptance:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    steps:
      - uses: actions/checkout@v3
      - name: Acceptance
        working-directory: ${{ github.workspace }}
        run: |
          if test -d out ; then find out -type f -exec touch {} + ; fi
          $TEST_DIR/acceptance-tests.sh
        shell: bash
      - name: Build results
        uses: actions/upload-artifact@v4
        with:
          name: labs
          path: ${{ github.workspace }}/out/*/*/acceptance.*
          overwrite: true
  cg:
    needs: [build]
    continue-on-error: ${{ inputs.run-optional-cg == 'free' || github.event_name != 'workflow_dispatch'}}
    runs-on: ubuntu-latest
    container:
      image: caseyrgb/rgb-tested:clang20
    if: ${{ inputs.run-optional-cg != 'skip' }}
    steps:
      - uses: actions/checkout@v3
      - name: CG
        working-directory: ${{ github.workspace }}
        run: $TEST_DIR/validate-cg.sh
        shell: bash
